name: grevidea
description: "Grevidea - A green vision powered by intelligent ideas. Mobile App Frontend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  battery_plus: ^6.2.1
  mobile_scanner: ^7.0.1
  image_picker: ^1.2.3
  google_sign_in: 6.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/forest/
    - assets/feature_catalog.json
